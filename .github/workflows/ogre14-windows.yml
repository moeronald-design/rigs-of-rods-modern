name: OGRE 14 compile loop (Windows)
# Windows-only. Builds OGRE 14.5.2, MyGUI, SocketW from source, gets the rest from vcpkg,
# then compiles RoR with MSVC using `ninja -k 0` so every compile error is reported at once.
# Each dependency is cached the moment it is built (so a later failure never loses it).
# To force a rebuild of a dependency, bump its key suffix (v1 -> v2).
on:
  push:
    branches: [ modern/ogre14-port ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      VCPKG_TRIPLET: x64-windows
      VCPKG_PREFIX: C:/vcpkg/installed/x64-windows
      OGRE_PREFIX: C:/deps/ogre
      MYGUI_PREFIX: C:/deps/mygui
      SOCKETW_PREFIX: C:/deps/socketw
    steps:
      - uses: actions/checkout@v7

      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      # ---------------- vcpkg ----------------
      - name: Restore vcpkg cache
        id: c-vcpkg
        uses: actions/cache/restore@v6
        with:
          path: C:/vcpkg/installed
          key: ogre14-vcpkg-v2
      - name: Install vcpkg packages
        if: steps.c-vcpkg.outputs.cache-hit != 'true'
        run: |
          vcpkg install --triplet $VCPKG_TRIPLET \
            openal-soft rapidjson fmt "curl[openssl]" ois angelscript freetype zlib
      - name: Save vcpkg cache
        if: steps.c-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: C:/vcpkg/installed
          key: ogre14-vcpkg-v2

      # ---------------- OGRE ----------------
      - name: Restore OGRE cache
        id: c-ogre
        uses: actions/cache/restore@v6
        with:
          path: C:/deps/ogre
          key: ogre14-ogre-v1
      - name: Build OGRE 14.5.2
        if: steps.c-ogre.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v14.5.2 https://github.com/OGRECave/ogre.git C:/src/ogre
          cmake -S C:/src/ogre -B C:/src/ogre/build -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$OGRE_PREFIX \
            -DOGRE_BUILD_DEPENDENCIES=ON -DOGRE_RESOURCEMANAGER_STRICT=0 \
            -DOGRE_BUILD_TOOLS=OFF -DOGRE_BUILD_SAMPLES=OFF -DOGRE_BUILD_TESTS=OFF \
            -DOGRE_BUILD_RENDERSYSTEM_D3D11=ON -DOGRE_BUILD_RENDERSYSTEM_GL3PLUS=ON \
            -DOGRE_BUILD_RENDERSYSTEM_D3D9=OFF \
            -DOGRE_BUILD_RENDERSYSTEM_VULKAN=OFF -DOGRE_BUILD_RENDERSYSTEM_GLES2=OFF \
            -DOGRE_BUILD_PLUGIN_ASSIMP=OFF -DOGRE_BUILD_PLUGIN_DOT_SCENE=OFF \
            -DOGRE_BUILD_PLUGIN_BSP=OFF -DOGRE_BUILD_PLUGIN_PCZ=OFF \
            -DOGRE_BUILD_COMPONENT_VOLUME=OFF -DOGRE_BUILD_COMPONENT_PYTHON=OFF \
            -DOGRE_BUILD_COMPONENT_JAVA=OFF -DOGRE_BUILD_COMPONENT_CSHARP=OFF \
            -DOGRE_INSTALL_DEPENDENCIES=ON
          cmake --build C:/src/ogre/build
          cmake --install C:/src/ogre/build
      - name: Save OGRE cache
        if: steps.c-ogre.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: C:/deps/ogre
          key: ogre14-ogre-v1

      # ---------------- MyGUI ----------------
      - name: Restore MyGUI cache
        id: c-mygui
        uses: actions/cache/restore@v6
        with:
          path: C:/deps/mygui
          key: ogre14-mygui-v1
      - name: Build MyGUI
        if: steps.c-mygui.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch MyGUI3.4.3 https://github.com/MyGUI/mygui.git C:/src/mygui
          cmake -S C:/src/mygui -B C:/src/mygui/build -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$MYGUI_PREFIX \
            -DCMAKE_PREFIX_PATH="$OGRE_PREFIX;$VCPKG_PREFIX" \
            -DMYGUI_RENDERSYSTEM=3 -DMYGUI_BUILD_DEMOS=OFF -DMYGUI_BUILD_TOOLS=OFF \
            -DMYGUI_BUILD_PLUGINS=OFF -DMYGUI_BUILD_TEST_APP=OFF -DMYGUI_BUILD_DOCS=OFF
          cmake --build C:/src/mygui/build
          cmake --install C:/src/mygui/build
      - name: Save MyGUI cache
        if: steps.c-mygui.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: C:/deps/mygui
          key: ogre14-mygui-v1

      # ---------------- SocketW ----------------
      - name: Restore SocketW cache
        id: c-socketw
        uses: actions/cache/restore@v6
        with:
          path: C:/deps/socketw
          key: ogre14-socketw-v1
      - name: Build SocketW
        if: steps.c-socketw.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/RigsOfRods/socketw.git C:/src/socketw
          cmake -S C:/src/socketw -B C:/src/socketw/build -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$SOCKETW_PREFIX -DCMAKE_PREFIX_PATH="$VCPKG_PREFIX"
          cmake --build C:/src/socketw/build
          cmake --install C:/src/socketw/build
      - name: Save SocketW cache
        if: steps.c-socketw.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: C:/deps/socketw
          key: ogre14-socketw-v1

      # ---------------- RoR ----------------
      - name: Configure Rigs of Rods
        run: |
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=$VCPKG_TRIPLET \
            -DCMAKE_PREFIX_PATH="$OGRE_PREFIX;$MYGUI_PREFIX;$SOCKETW_PREFIX" 2>&1 | tee configure.log

      - name: Compile (keep going to list every error)
        run: |
          set +e
          cmake --build build -- -k 0 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          grep -E "error C[0-9]+|fatal error|error LNK|: error:" build.log | sed -E 's/^.*source[\\/]//' | sort -u > errors-unique.txt
          echo "build exit code: $rc"
          echo "unique error lines: $(wc -l < errors-unique.txt)"
          echo "==== FIRST 200 UNIQUE ERRORS ===="
          head -200 errors-unique.txt
          exit $rc

      - name: Package for testing
        run: |
          cmake --install build --prefix redist 2>&1 | tail -5 || true
          mkdir -p redist
          for d in "$OGRE_PREFIX/bin" "$MYGUI_PREFIX/bin" "$SOCKETW_PREFIX/bin" "C:/vcpkg/installed/$VCPKG_TRIPLET/bin" "build/bin"; do
            if [ -d "$d" ]; then cp -n "$d"/*.dll redist/ 2>/dev/null || true; fi
          done
          # MyGUI (and others) install DLLs in subfolders like bin/Release: copy recursively
          find C:/deps -iname '*.dll' -exec cp -n {} redist/ \; 2>/dev/null || true
          # OGRE 14 media needed at runtime (group OgreInternal): Main + RTShaderLib -> resources/ogre14/
          hdr=$(find "$OGRE_PREFIX" -name OgreUnifiedShader.h | head -1)
          if [ -z "$hdr" ]; then echo "MISSING: OGRE Media (OgreUnifiedShader.h) under $OGRE_PREFIX"; exit 1; fi
          media=$(dirname "$(dirname "$hdr")")
          echo "OGRE media: $media"
          mkdir -p redist/resources/ogre14
          cp -r "$media/Main" "$media/RTShaderLib" redist/resources/ogre14/
          for req in MyGUIEngine.dll OgreMain.dll RoR.exe resources/ogre14/Main/OgreUnifiedShader.h; do
            if [ ! -f "redist/$req" ]; then echo "MISSING in package: $req"; find C:/deps build -iname "${req%.*}*" | head; exit 1; fi
          done
          ls redist | head -80
          powershell -Command "Compress-Archive -Path redist/* -DestinationPath RoR-ogre14-windows.zip"
          ls -la RoR-ogre14-windows.zip

      - name: Upload game build
        uses: actions/upload-artifact@v7
        with:
          name: RoR-ogre14-windows
          path: RoR-ogre14-windows.zip
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ogre14-windows-logs
          path: |
            configure.log
            build.log
            errors-unique.txt
