name: OGRE 14 compile loop
# Builds OGRE 14.5.2 from source, then compiles Rigs of Rods against it.
# Uses `ninja -k 0` so ALL compile errors are reported in a single run.
on:
  push:
    branches: [ modern/ogre14-port ]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    env:
      DEPS: /opt/deps
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build pkg-config gettext \
            libsdl2-dev libfreetype-dev zlib1g-dev libzzip-dev libpugixml-dev \
            libxrandr-dev libxt-dev libxaw7-dev libgl1-mesa-dev libglu1-mesa-dev libx11-dev \
            libssl-dev libopenal-dev libois-dev libcurl4-openssl-dev rapidjson-dev libfmt-dev

      - name: Cache built dependencies
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: /opt/deps
          key: ogre14-deps-v1-${{ hashFiles('.github/workflows/ogre14-linux.yml') }}

      - name: Build OGRE 14.5.2
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v14.5.2 https://github.com/OGRECave/ogre.git /tmp/ogre
          cmake -S /tmp/ogre -B /tmp/ogre/build -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$DEPS \
            -DOGRE_BUILD_DEPENDENCIES=OFF -DOGRE_RESOURCEMANAGER_STRICT=0 \
            -DOGRE_BUILD_TOOLS=OFF -DOGRE_BUILD_SAMPLES=OFF -DOGRE_BUILD_TESTS=OFF \
            -DOGRE_BUILD_RENDERSYSTEM_GL3PLUS=ON -DOGRE_BUILD_RENDERSYSTEM_VULKAN=OFF \
            -DOGRE_BUILD_RENDERSYSTEM_GLES2=OFF \
            -DOGRE_BUILD_PLUGIN_ASSIMP=OFF -DOGRE_BUILD_PLUGIN_DOT_SCENE=OFF \
            -DOGRE_BUILD_PLUGIN_BSP=OFF -DOGRE_BUILD_PLUGIN_PCZ=OFF \
            -DOGRE_BUILD_COMPONENT_VOLUME=OFF -DOGRE_BUILD_COMPONENT_PYTHON=OFF \
            -DOGRE_BUILD_COMPONENT_JAVA=OFF -DOGRE_BUILD_COMPONENT_CSHARP=OFF
          cmake --build /tmp/ogre/build -j4
          cmake --install /tmp/ogre/build

      - name: Build MyGUI
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch MyGUI3.4.3 https://github.com/MyGUI/mygui.git /tmp/mygui
          cmake -S /tmp/mygui -B /tmp/mygui/build -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$DEPS -DCMAKE_PREFIX_PATH=$DEPS \
            -DMYGUI_RENDERSYSTEM=3 -DMYGUI_BUILD_DEMOS=OFF -DMYGUI_BUILD_TOOLS=OFF \
            -DMYGUI_BUILD_PLUGINS=OFF -DMYGUI_BUILD_TEST_APP=OFF
          cmake --build /tmp/mygui/build -j4
          cmake --install /tmp/mygui/build

      - name: Build SocketW and AngelScript
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/RigsOfRods/socketw.git /tmp/socketw
          cmake -S /tmp/socketw -B /tmp/socketw/build -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$DEPS
          cmake --build /tmp/socketw/build -j4 && cmake --install /tmp/socketw/build
          git clone --depth 1 https://github.com/AnotherFoxGuy/angelscript.git /tmp/angelscript
          cmake -S /tmp/angelscript -B /tmp/angelscript/build -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$DEPS
          cmake --build /tmp/angelscript/build -j4 && cmake --install /tmp/angelscript/build

      - name: Configure Rigs of Rods
        run: |
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$DEPS -DROR_USE_PCH=OFF 2>&1 | tee configure.log

      - name: Compile (keep going to list every error)
        run: |
          cmake --build build -- -k 0 2>&1 | tee build.log
          echo "==== ERROR SUMMARY ===="
          grep -E "error:|Error " build.log | sed 's/^.*source\///' | sort | uniq -c | sort -rn | head -80 || true
          test "${PIPESTATUS[0]}" -eq 0

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ogre14-logs
          path: |
            configure.log
            build.log
